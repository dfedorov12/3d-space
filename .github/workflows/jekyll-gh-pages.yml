# Sample workflow for building and deploying a Jekyll site to GitHub Pages
name: Deploy Jekyll with GitHub Pages dependencies preinstalled

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["main"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write
  actions: read   # nur zum Nachsehen, ob das Paket schon gelistet ist (Schritt „Warten …“)

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Build job
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      # Cache-Busting: ?v=… in index.html beim Build durch den Commit-SHA ersetzen.
      # So lädt der Browser nach jedem Push garantiert die neue app.js/style.css –
      # ohne manuelles Hochzählen und ohne Rück-Commit.
      - name: Cache-Busting
        run: sed -i -E "s/\?v=[A-Za-z0-9]+/?v=${GITHUB_SHA::8}/g" index.html
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Build with Jekyll
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./
          destination: ./_site
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3

  # Deployment job
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || steps.deployment2.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      # GitHub listet das hochgeladene Paket manchmal erst Sekunden später. deploy-pages fragt
      # sofort danach und bricht dann mit „No artifacts named github-pages“ ab (in der
      # Bedarfsanfrage am 25.11.2026 dreimal, das Paket war jeweils eine Sekunde später da).
      # Darum erst warten, bis es da ist.
      - name: Warten, bis das Paket gelistet ist
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for i in $(seq 1 30); do
            n=$(gh api "repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/artifacts" --jq '[.artifacts[] | select(.name == "github-pages")] | length')
            if [ "${n:-0}" -ge 1 ]; then echo "Paket gelistet (Versuch $i)"; sleep 3; exit 0; fi
            sleep 2
          done
          echo "::warning::Paket nach 60 Sekunden noch nicht gelistet, Veröffentlichen wird trotzdem versucht"

      - name: Deploy to GitHub Pages
        id: deployment
        continue-on-error: true   # zweiter Versuch weiter unten
        uses: actions/deploy-pages@v4

      # deploy-pages sieht das Paket manchmal auch nach dem Warten noch nicht (25.11.2026 in
      # e-rechnung). Dann nach einer halben Minute ein zweiter Versuch. Scheitert auch der, ist der Lauf rot.
      - name: Vor dem zweiten Versuch warten
        if: steps.deployment.outcome == 'failure'
        run: sleep 30

      - name: Veröffentlichen, zweiter Versuch
        id: deployment2
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v4
